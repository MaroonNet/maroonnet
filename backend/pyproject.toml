[project]
name = "maroonnet-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
# backend/ is the import root: `import server`, `import missiondb`.
pythonpath = ["."]
testpaths = ["missiondb/tests"]
