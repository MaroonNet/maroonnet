[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maroonnet-missiondb"
version = "0.1.0"
description = "MaroonNet mission database: what the radios reported, when, and the replay of it."
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["missiondb*"]
