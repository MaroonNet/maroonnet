<title>missiondb Explorer</title>

<style>
/* Layout: one full-height canvas of draggable table cards; toolbar on top; details drawer on the right (bottom sheet on phones). */
:root{
  --bg:#e9ecef; --grid:#c9cfd6; --card:#ffffff; --head:#f4f6f8; --fg:#15191e; --muted:#58616c;
  --line:#d4d9df; --edge:#7b8590; --accent:#8c1d2c; --accent-soft:#f6e6e8; --on-accent:#ffffff; --hi:#fff3c4;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(21,25,30,.08),0 4px 12px rgba(21,25,30,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101316; --grid:#262c33; --card:#1a1f24; --head:#21272d; --fg:#e8ecf0; --muted:#9aa4ae;
  --line:#2f363e; --edge:#7d8893; --accent:#e5808e; --accent-soft:#3a2026; --on-accent:#1a0d10; --hi:#4a3f12;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101316; --grid:#262c33; --card:#1a1f24; --head:#21272d; --fg:#e8ecf0; --muted:#9aa4ae;
  --line:#2f363e; --edge:#7d8893; --accent:#e5808e; --accent-soft:#3a2026; --on-accent:#1a0d10; --hi:#4a3f12;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.4;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:5}
.bar h1{margin:0 8px 0 0;font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.01em}
.src{font-size:12px;color:var(--muted);min-width:0;flex:1 1 220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src b{color:var(--fg);font-weight:600}
.btn{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--edge)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn.icon{width:32px;padding:0;font-family:var(--mono);font-weight:600}
.grp{display:flex;gap:4px}
.main{flex:1;display:flex;min-height:0;position:relative}
.canvas{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;
  background-color:var(--bg);background-image:radial-gradient(var(--grid) 1px,transparent 1.2px)}
.canvas.panning{cursor:grabbing}
.canvas.drop{box-shadow:inset 0 0 0 3px var(--accent)}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--edge);stroke-width:1.4}
.edge.hot{stroke:var(--accent);stroke-width:2.4}
.edges .foot{fill:none;stroke:var(--edge);stroke-width:1.4}
.edges .foot.hot{stroke:var(--accent);stroke-width:2}
.edges .dot{fill:var(--bg);stroke:var(--edge);stroke-width:1.4}
.edges .dot.hot{stroke:var(--accent)}
.hit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:help}
.card{position:absolute;width:260px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.card.dragging{z-index:3;cursor:grabbing}
.chead{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 12px;background:var(--head);border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;cursor:move}
.chead .nm{font-family:var(--mono);font-weight:600;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .ct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chead .ct.has{color:var(--accent);font-weight:600}
.col{display:flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 12px;font-family:var(--mono);font-size:12px;cursor:pointer}
.col:last-child{border-radius:0 0 8px 8px}
.col:hover,.col.hot{background:var(--hi)}
.col .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col .ty{color:var(--muted);font-size:11px;white-space:nowrap}
.col .ty i{font-style:normal;opacity:.75}
.k{display:inline-block;min-width:20px;text-align:center;font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:.04em;line-height:14px;border-radius:3px;padding:0 3px}
.k.pk{background:var(--accent);color:var(--on-accent)}
.k.fk{border:1px solid var(--edge);color:var(--fg)}
.col .gap{display:inline-block;width:20px}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px;z-index:2}
.legend div{display:flex;align-items:center;gap:8px}
.legend svg{flex:none}
.legend .t{font-weight:600;color:var(--fg);text-transform:uppercase;letter-spacing:.06em;font-size:10.5px}
.zoomlbl{position:absolute;right:12px;bottom:12px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;z-index:2;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-family:var(--mono);font-size:11.5px;padding:4px 8px;border-radius:4px;z-index:9;white-space:nowrap}
/* drawer */
.drawer{width:400px;max-width:100%;flex:none;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.drawer[hidden]{display:none!important}
.dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-family:var(--mono);font-size:16px;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.db{overflow:auto;padding:0 16px 24px;min-height:0}
.db h3{margin:18px 0 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:12px}
th{text-align:left;font-weight:600;font-size:11px;color:var(--muted);background:var(--head);padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:5px 8px;border-bottom:1px solid var(--line);font-family:var(--mono);white-space:nowrap;vertical-align:top}
tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;font-family:var(--sans)}
td .nul{color:var(--muted);font-style:italic}
tr.flash td{background:var(--hi)}
a.lk{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
ul.rel{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:12px;display:flex;flex-direction:column;gap:4px}
pre{margin:0;padding:10px;background:var(--head);border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:11.5px;line-height:1.5;overflow-x:auto;white-space:pre}
.empty{padding:12px;background:var(--head);border-radius:6px;color:var(--muted);font-size:12.5px}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.err{color:#b3261e}
:root[data-theme="dark"] .err{color:#f2766b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#f2766b}}
input.flt{height:30px;width:100%;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:0 8px;margin-bottom:8px}
@media (max-width:760px){
  .main{flex-direction:column}
  .drawer{width:100%;height:52%;border-left:0;border-top:1px solid var(--line)}
  .legend{display:none}
  .src{flex-basis:100%;order:9}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

        <div><svg width="44" height="14"><line x1="0" y1="7" x2="34" y2="7" style="stroke:var(--edge)"/><circle cx="38" cy="7" r="3.5" style="fill:var(--card);stroke:var(--edge)"/><path d="M30,1 V13" style="stroke:var(--edge)"/></svg> zero or one (FK nullable)</div>

    </aside>
  </div>
</div>

// ------------------------------------------------------------------ edges
function rowY(t, col){

function allEdges(){
  var out = [];

    t.fks.forEach(function(f){

      var to = f.to || (byName[f.table].columns.filter(function(c){ return c.pk; })[0] || {}).name;

function drawEdges(){

var raf = 0;

// ------------------------------------------------------------------ view (pan / zoom)
function applyView(){

function readSqlite(buf){

      var name = r[0], qn = '"' + name.replace(/"/g, '""') + '"';

      });

    if (json) { try { useResult(readJson(rd.result), {name: f.name, kind: 'JSON'}); } catch (e) { setSrc('<span class="err">' + esc(f.name) + ' is not valid JSON: ' + esc(e.message) + '</span>'); } return; }
    readSqlite(rd.result).then(function(res){ useResult(res, {name: f.name, kind: 'SQLite'}); }, function(e){
      setSrc('<span class="err">Could not open ' + esc(f.name) + ': ' + esc(e.message) + '. Check that it is a SQLite file.</span>');
    });
  };
  json ? rd.readAsText(f) : rd.readAsArrayBuffer(f);
}
function setSrc(h){ $('src').innerHTML = h; }

// A small made-up mission, so the diagram can be seen with rows in it. Nothing here is real.

  d.sector_dispatch = [[1,1,6],[1,2,6],[2,3,6],[3,4,11],[3,5,11]].map(function(p, i){ return {dispatch_id:i + 1, search_sector_id:p[0], team_id:p[1], sent_time:T(p[2]), ack_time: p[1] === 5 ? null : T(p[2] + 1), packet_id:1000 + i}; });
  d.search_sector_point = [];
  [[0.004,0.006,0.030,0.040],[0.032,0.008,0.056,0.044],[0.006,0.050,0.028,0.092],[0.032,0.054,0.056,0.094]].forEach(function(b, i){
    [[b[0],b[1]],[b[0],b[3]],[b[2],b[3]],[b[2],b[1]]].forEach(function(p, j){ d.search_sector_point.push({search_sector_id:i + 1, point_order:j + 1, lat:+(lat0 + p[0]).toFixed(6), lon:+(lon0 + p[1]).toFixed(6)}); });
  });
  d.sector_entry = [{team_id:1,search_sector_id:1,entered_time:T(14)},{team_id:2,search_sector_id:1,entered_time:T(16)},{team_id:3,search_sector_id:2,entered_time:T(18)},{team_id:4,search_sector_id:3,entered_time:T(22)},{team_id:5,search_sector_id:3,entered_time:T(25)}];

    {waypoint_id:3, type_code:'hazard', lat:+(lat0 + 0.040).toFixed(6), lon:+(lon0 + 0.060).toFixed(6), elevation:null, time:T(90), created_time:T(90), team_id:null, message_id:null, name:'Example hazard', description:null, icon:null, note:'Made up', expire_time:T(200), removed_time:T(180)}];
  return d;
}

function render(){
  if (!source) setSrc('<b>Empty database</b> · ' + tables.length + ' tables from backend/missiondb (migration 0002). Only message_type and waypoint_type have rows (their seed types).');
  else {
    var total = 0, filled = 0;
    tables.forEach(function(t){ var c = data[t.name] ? data[t.name].rows.length : 0; total += c; if (c) filled++; });
    setSrc('<b>' + esc(source.name) + '</b> · ' + source.kind + ' · ' + n(total) + ' rows in ' + filled + ' of ' + tables.length + ' tables' + (source.example ? ' · made-up example rows, not a real mission' : ' · read in this browser, not uploaded'));
  }
  renderCards(); drawEdges(); drawDrawer();
}
