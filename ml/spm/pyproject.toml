[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spm"
version = "0.1.0"
description = "MaroonNet Sector Probability Mapping: lost-person probability surfaces and their evaluation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyproj>=3.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]
# Added in step 3 (terrain stacks). Kept out of the core install so step 1 installs anywhere.
geo = [
    "rasterio>=1.4",
    "affine>=2.4",
    "geopandas>=1.0",
    "pyogrio>=0.10",
    "shapely>=2.0",
    "osmium>=4.0",
]
# Heatmap PNGs (`spm predict`).
viz = ["matplotlib>=3.9"]

[project.scripts]
spm = "spm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
